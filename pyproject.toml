[project]
name = "text-style-detection"
version = "0.2.0"
description = "Multi-task English text style and tone classification (TextCNN, BiLSTM, DistilBERT) with FastAPI and Streamlit."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Application
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "streamlit>=1.57.0",
    "requests>=2.32",
    # Data and classical ML (baseline from the Machine Learning course)
    "pandas>=3.0.3",
    "numpy>=2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.5.3",
    "spacy>=3.8.13",
    "en-core-web-sm",
    # Deep learning (CPU wheels by default, see [tool.uv.sources])
    "torch>=2.6",
    "transformers>=4.46",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",  # FastAPI TestClient
    "ruff>=0.8",
]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
    "seaborn>=0.13.2",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.uv]
# This is an application, not a library: dependencies are installed, the code is not.
package = false
# `uv sync` installs the application plus the dev and notebook groups.
# Use `uv sync --no-dev --no-group notebook` for a minimal runtime environment.
default-groups = ["dev", "notebook"]

# CPU-only PyTorch on Linux and Windows (small download, works everywhere).
# macOS wheels from PyPI already support CPU and Apple GPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.ipynb", "skills", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
